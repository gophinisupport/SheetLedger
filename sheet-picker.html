<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheet Picker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    let isPickerApiLoaded = false;

    function initPicker() {
      gapi.load('picker', {
        'callback': () => {
          isPickerApiLoaded = true;
          if (window.PickerChannel) {
            window.PickerChannel.postMessage(JSON.stringify({ type: 'READY' }));
          }
        }
      });
    }

    function openGooglePicker(appId, accessToken, apiKey) {
      if (!isPickerApiLoaded) {
        console.error('Google Picker API 未載入完成。');
        return;
      }

      // 視圖 1：他人共享給我的試算表
      const sharedView = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS)
          .setMimeTypes('application/vnd.google-apps.spreadsheet')
          .setOwnedByMe(false);

      // 視圖 2：所有試算表
      const allSheetsView = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS)
          .setMimeTypes('application/vnd.google-apps.spreadsheet');

      const origin = window.location.protocol + '//' + window.location.host;

      const picker = new google.picker.PickerBuilder()
          .setAppId(appId)
          .setOAuthToken(accessToken)
          .setDeveloperKey(apiKey)
          .setOrigin(origin)
          .setTitle('Select Google Sheet')
          .addView(sharedView)
          .addView(allSheetsView)
          .setCallback(pickerCallback)
          .build();

      picker.setVisible(true);
    }

    function pickerCallback(data) {
      if (data.action === google.picker.Action.PICKED) {
        const doc = data.docs[0];
        const result = {
          type: 'RESULT',
          id: doc.id,
          name: doc.name
        };

        if (window.PickerChannel) {
          window.PickerChannel.postMessage(JSON.stringify(result));
        }
      } else if (data.action === google.picker.Action.CANCEL) {
        if (window.PickerChannel) {
          window.PickerChannel.postMessage(JSON.stringify({ type: 'CANCEL' }));
        }
      }
    }
  </script>
</head>
<body onload="initPicker()">
</body>
</html>
